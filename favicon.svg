<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="waxGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#c84538"/>
      <stop offset="60%" stop-color="#a8352a"/>
      <stop offset="100%" stop-color="#6e1a12"/>
    </radialGradient>
    <filter id="sealShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#10151c" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Wax seal background -->
  <circle cx="32" cy="32" r="28" fill="url(#waxGrad)" filter="url(#sealShadow)"/>
  <!-- Inner seal border -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#f4e5e2" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.6"/>
  <circle cx="32" cy="32" r="21" fill="none" stroke="#f4e5e2" stroke-width="1.4" opacity="0.85"/>
  <!-- Monogram / Quill P & L -->
  <text x="32" y="38" font-family="Charter, 'Iowan Old Style', 'Palatino Linotype', Georgia, serif" font-size="20" font-weight="bold" fill="#fdfaf3" text-anchor="middle" letter-spacing="1">PyL</text>
  <!-- Tiny decorative flourish -->
  <circle cx="32" cy="44" r="1.5" fill="#fdfaf3" opacity="0.8"/>
</svg>
